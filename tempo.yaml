# Tempo 3.x monolithic config (`-target=all`, the image default).
# 3.0 removed `ingester` / `compactor` in favor of live-store + backend scheduler.
# https://grafana.com/docs/tempo/latest/set-up-for-tracing/setup-tempo/migrate-to-3/

stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

live_store:
  max_trace_idle: 10s
  max_block_duration: 5m
  max_block_bytes: 1000000

backend_scheduler:
  provider:
    compaction:
      compaction:
        compaction_window: 1h
        max_block_bytes: 100000000
        block_retention: 24h
        compacted_block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
